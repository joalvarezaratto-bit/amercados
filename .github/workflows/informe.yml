name: AMercados - informe matinal + flashes

# GitHub Actions NO respeta el cron: en la practica lanza el bot 7-8 veces al
# dia con huecos de 3-5 horas. Para no depender de eso, cada corrida se queda
# VIVA hasta ~5,7 horas revisando cada 5 minutos si toca enviar algo (informe,
# flash, edicion viva, salud). Las corridas se encadenan gracias al grupo de
# concurrencia: la siguiente espera a que termine la anterior. Asi los envios
# salen con precision de minutos aunque el cron llegue tarde.

on:
  schedule:
    - cron: "17 */2 * * *"   # cada 2 horas: solo necesita "despertar" antes de que termine la corrida anterior
  workflow_dispatch:          # boton "Run workflow": manda el informe ahora (sin gate) y luego vigila

permissions:
  contents: write

concurrency:
  group: amercados-vigilante
  cancel-in-progress: false

jobs:
  vigilante:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Vigilar y enviar (bucle de ~5,6 horas, revisa cada 5 min)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BCCH_TOKEN: ${{ secrets.BCCH_TOKEN }}
        run: |
          git config user.name "amercados-bot"
          git config user.email "amercados-bot@users.noreply.github.com"
          guardar() {
            git add state.json 2>/dev/null || true
            git add docs 2>/dev/null || true
            git add noticias_vistas.json 2>/dev/null || true
            git add edicion_hoy.json 2>/dev/null || true
            git add volumen_hist.json 2>/dev/null || true
            if git commit -q -m "informe $(TZ=America/Santiago date +%Y-%m-%d\ %H:%M)"; then
              git pull -q --rebase --autostash || true
              git push -q || echo "no se pudo subir; se reintenta en la proxima vuelta"
            fi
          }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python amercados.py send || true
            guardar
          fi
          fin=$((SECONDS + 20400))   # 5 h 40 min
          while [ $SECONDS -lt $fin ]; do
            git pull -q --rebase --autostash || true
            python amercados.py send --gate || true
            python amercados.py flash --gate || true
            python amercados.py actualizar --gate || true
            python amercados.py health || true
            guardar
            sleep 300
          done
          echo "corrida terminada; la siguiente ya deberia estar en cola"
