name: AMercados - informe matinal + flashes

# Corre cada hora (a los :05 UTC). El bot decide con `--gate` si en Chile ya
# son las 07:xx de un dia habil (informe completo) o las 13:xx / 18:xx (flash
# corto con precios + titulares nuevos). Asi el horario de verano nunca lo
# descuadra (misma tecnica que news-bot y dolar-bot). GitHub Actions puede
# atrasarse unos minutos: los envios llegan ~:05-:20.

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:      # boton "Run workflow" para mandarlo a mano (sin gate)

permissions:
  contents: write

concurrency:
  group: amercados-estado
  cancel-in-progress: false

jobs:
  informe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generar y enviar el informe
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python amercados.py send --gate
            python amercados.py flash --gate
          else
            python amercados.py send
          fi
      - name: Guardar estado y publicar HTML (GitHub Pages en docs/)
        run: |
          git config user.name "amercados-bot"
          git config user.email "amercados-bot@users.noreply.github.com"
          # cada archivo POR SEPARADO (si uno no existe, no bloquea a los demas)
          git add state.json 2>/dev/null || true
          git add noticias_vistas.json 2>/dev/null || true
          git add docs 2>/dev/null || true
          git commit -m "informe $(date -u +%Y-%m-%d)" || { echo "sin cambios"; exit 0; }
          git push || (git pull --rebase --autostash && git push) || echo "no se pudo subir, la proxima corrida reintenta"
